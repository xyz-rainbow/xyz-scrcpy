name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r .requirements.txt ruff

      - name: Syntax check (Python)
        run: >
          python -m py_compile
          install_xyz.py repair_xyz.py
          lib/xyz_scrcpy/_paths.py lib/xyz_scrcpy/_stub_loader.py lib/xyz_scrcpy/install_xyz.py
          lib/xyz_scrcpy/win_path_shim.py lib/xyz_scrcpy/adb_resolve.py
          lib/xyz_scrcpy/repair_xyz.py lib/xyz_scrcpy/setup_vendor.py lib/xyz_scrcpy/vendor_bootstrap.py
          bin/menu.py bin/config_loader.py bin/monitor.py
          bin/check_and_repair.py bin/launch_with_checks.py bin/install_tui.py
          bin/terminal_open.py bin/adb_transport.py bin/device_tracker.py bin/alias_sync.py packaging/excludes.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Ruff lint
        run: ruff check install_xyz.py repair_xyz.py lib/xyz_scrcpy bin/ tests/ packaging/

      - name: Bash syntax (stub scripts)
        if: runner.os != 'Windows'
        run: bash -n installer.sh launchers/unix/installer.sh launchers/unix/repair_xyz.sh bin/monitor.sh bin/check_and_repair.sh bin/launch_with_checks.sh scripts/clean_dev.sh scripts/validate.sh

      - name: Install smoke (headless, Linux)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/xyz-scrcpy-home
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 install_xyz.py --action install --yes --no-open-terminal --skip-vendor-download
          test -x "$HOME/.local/bin/xyz-scrcpy"

  vendor-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor download smoke
        env:
          PYTHONPATH: lib
        run: |
          python3 -c "
          from pathlib import Path
          from xyz_scrcpy import vendor_bootstrap as vb
          r = vb.ensure_android_tools(Path('.'), 'linux', verbose=True)
          assert r.adb_ok, r.attempts
          assert r.scrcpy_ok, r.attempts
          "
          ./vendor/adb version
          ./vendor/scrcpy --version
