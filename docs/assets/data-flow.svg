<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bfff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff66ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-lime" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#bfff00" opacity="0.7"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff66ff" opacity="0.7"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#05d9e8" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" fill="#09090b" rx="12" stroke="#27272a" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="30" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="url(#neon-h)" text-anchor="middle" filter="url(#glow)">MONITOR SERVICE · DATA FLOW</text>

  <!-- ===== CONNECTION ===== -->
  <rect x="40" y="56" width="120" height="44" rx="8" fill="#1a1a2e" stroke="#bfff00" stroke-width="1.2"/>
  <text x="100" y="74" font-family="monospace" font-size="10" fill="#bfff00" text-anchor="middle" font-weight="700">🔌 DEVICE</text>
  <text x="100" y="90" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">USB / Wireless ADB</text>

  <!-- Arrow: Device → Monitor Loop -->
  <line x1="160" y1="78" x2="208" y2="78" stroke="#bfff00" stroke-width="1.5" marker-end="url(#arrow-lime)" opacity="0.7"/>

  <!-- ===== MONITOR LOOP ===== -->
  <rect x="216" y="46" width="200" height="64" rx="8" fill="#1a0a2e" stroke="#d300c5" stroke-width="1.2"/>
  <text x="316" y="66" font-family="monospace" font-size="10" fill="#ff66ff" text-anchor="middle" font-weight="700">🕵️ MONITOR LOOP</text>
  <text x="316" y="82" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">Checks serial changes</text>
  <text x="316" y="96" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">active_recall / mic bus</text>

  <!-- Arrow: Monitor → Lock Guard -->
  <line x1="416" y1="78" x2="464" y2="78" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#arrow-cyan)" opacity="0.7"/>

  <!-- ===== LOCK GUARD ===== -->
  <rect x="472" y="56" width="140" height="44" rx="8" fill="#0f1a2e" stroke="#05d9e8" stroke-width="1.2"/>
  <text x="542" y="74" font-family="monospace" font-size="10" fill="#05d9e8" text-anchor="middle" font-weight="700">🔒 LOCK GUARD</text>
  <text x="542" y="90" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">xyz_menu.lock active?</text>

  <!-- Arrow: Lock → Launch (down) -->
  <line x1="620" y1="90" x2="660" y2="90" stroke="#a1a1aa" stroke-width="1" opacity="0.5"/>
  <line x1="660" y1="90" x2="660" y2="150" stroke="#a1a1aa" stroke-width="1" opacity="0.5"/>

  <!-- ===== LAUNCH DECISION ===== -->
  <rect x="600" y="150" width="100" height="44" rx="8" fill="#1a0a2e" stroke="#ff66ff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="650" y="170" font-family="monospace" font-size="9" fill="#ff66ff" text-anchor="middle">menu / scrcpy active?</text>
  <text x="650" y="184" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">YES / NO</text>

  <!-- Arrow: Decision → Yes (prevent spam) -->
  <line x1="600" y1="172" x2="40" y2="172" stroke="#71717a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="320" y="168" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">YES → skip terminal popup (anti-spam)</text>

  <!-- ===== SCRCPY LAUNCH ===== -->
  <rect x="216" y="210" width="200" height="64" rx="8" fill="#0f0f18" stroke="#39ff14" stroke-width="1.2"/>
  <text x="316" y="230" font-family="monospace" font-size="10" fill="#39ff14" text-anchor="middle" font-weight="700">🖥️ SCRCPY LAUNCH</text>
  <text x="316" y="248" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">audio & mic bus routing</text>
  <text x="316" y="262" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">launch --render-driver=software</text>

  <!-- Arrow: Decision NO → Launch -->
  <line x1="650" y1="194" x2="650" y2="242" stroke="#bfff00" stroke-width="1.5" opacity="0.7"/>
  <line x1="650" y1="242" x2="416" y2="242" stroke="#bfff00" stroke-width="1.5" marker-end="url(#arrow-lime)" opacity="0.7"/>
  <text x="540" y="236" font-family="monospace" font-size="8" fill="#bfff00">NO → spawn controller</text>

  <!-- ===== RECONNECT LOOP ===== -->
  <line x1="216" y1="242" x2="140" y2="242" stroke="#d300c5" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="242" x2="140" y2="110" stroke="#d300c5" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="110" x2="216" y2="110" stroke="#d300c5" stroke-width="1.5" marker-end="url(#arrow-pink)" opacity="0.7"/>

  <!-- Loop label -->
  <rect x="48" y="148" width="82" height="42" rx="4" fill="#1a0a2e" stroke="#d300c5" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="89" y="164" font-family="monospace" font-size="8" fill="#ff66ff" text-anchor="middle">🔄 RECONNECT</text>
  <text x="89" y="180" font-family="monospace" font-size="7" fill="#71717a" text-anchor="middle">Auto-Discover</text>

  <!-- ===== MONITOR SETTINGS BAR ===== -->
  <rect x="40" y="290" width="640" height="52" rx="8" fill="#0f0f18" stroke="#27272a" stroke-width="0.5"/>
  <text x="360" y="310" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">PAUSE STATE ON EXIT</text>

  <!-- Off -->
  <rect x="80" y="318" width="100" height="18" rx="3" fill="#27272a" stroke="#71717a" stroke-width="0.5"/>
  <text x="130" y="331" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">OFF — auto-start</text>

  <!-- Pause Active -->
  <rect x="220" y="318" width="180" height="18" rx="3" fill="#1a2e1a" stroke="#bfff00" stroke-width="0.5"/>
  <text x="310" y="331" font-family="monospace" font-size="8" fill="#bfff00" text-anchor="middle">PAUSE_ACTIVE — ignore devices</text>

  <!-- Seen Disconnect -->
  <rect x="440" y="318" width="180" height="18" rx="3" fill="#2e1a2e" stroke="#ff66ff" stroke-width="0.5"/>
  <text x="530" y="331" font-family="monospace" font-size="8" fill="#ff66ff" text-anchor="middle">SEEN_DISCONNECT — auto-resume</text>
</svg>
