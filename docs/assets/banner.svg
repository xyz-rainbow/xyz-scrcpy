<svg width="850" height="250" viewBox="0 0 850 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Lime Green to Neon Pink Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bfff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#df9b80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff66ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Background -->
  <rect width="850" height="250" fill="#09090b" rx="12" stroke="url(#neon-grad)" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56" />
  <circle cx="45" cy="25" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="25" r="6" fill="#27c93f" />

  <!-- Main Title -->
  <text x="50%" y="45%" font-family="'Courier New', Courier, monospace" font-size="54" font-weight="900" letter-spacing="4" fill="url(#neon-grad)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">
    XYZ · SCRCPY
  </text>

  <!-- Tagline -->
  <text x="50%" y="68%" font-family="monospace" font-size="16" fill="#a1a1aa" text-anchor="middle">
    ╰➤｢ X ⟁ Z ｣ » <tspan fill="#bfff00">α η d r σ ι d</tspan> <tspan fill="#ff66ff">m σ η ι τ σ r</tspan> «
  </text>

  <!-- Divider -->
  <rect x="125" y="195" width="600" height="1" fill="url(#neon-grad)" opacity="0.4"/>

  <!-- Footer Signatures -->
  <text x="125" y="220" font-family="'Courier New', Courier, monospace" font-size="12" fill="#71717a">
    Developed with ❤️ by xyz-rainbow
  </text>
  
  <text x="725" y="220" font-family="'Courier New', Courier, monospace" font-size="12" fill="#71717a" text-anchor="end">
    #xyz-rainbowtechnology | rainbowtechnology.xyz
  </text>
</svg>
