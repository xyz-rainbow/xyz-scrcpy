[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xyz-scrcpy"
version = "1.0.1"
description = "Interactive Android launcher and monitor on top of scrcpy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bin/menu.py" = ["E402", "E701", "E722"]

[tool.setuptools]
py-modules = []
